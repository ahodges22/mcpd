name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Run tests
        run: |
          mkdir -p "$HOME/.tmp"
          chmod 700 "$HOME/.tmp"
          TMPDIR="$HOME/.tmp" go test -count=1 -race ./...

  vet:
    name: Vet and vulnerability scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Run go vet
        run: go vet ./...
      - name: Run govulncheck
        run: go tool govulncheck ./...

  release-snapshot:
    name: Verify release artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Build release snapshot
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7
        with:
          distribution: goreleaser
          version: v2.17.1
          args: release --snapshot --clean --skip=sign
      - name: Verify release contents
        run: |
          test "$(find .release -maxdepth 1 -name 'mcpd_*_*.tar.gz' | wc -l)" -eq 4
          for archive in .release/mcpd_*_*.tar.gz; do
            archive_contents="$(tar -tzf "$archive")"
            grep -qx 'install.sh' <<<"$archive_contents"
            grep -qx 'dist/mcpd-tray.service' <<<"$archive_contents"
            grep -qx 'dist/dev.mcpd.tray.plist' <<<"$archive_contents"
            grep -qx 'THIRD-PARTY-NOTICES' <<<"$archive_contents"
          done
          cd .release
          sha256sum --check checksums.txt
