version: 2

project_name: mcpd
dist: .release

builds:
  - id: mcpd
    main: ./cmd/mcpd
    binary: mcpd
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w
      - -X github.com/ahodges22/mcpd/internal/version.stamped={{ .Version }}
    mod_timestamp: "{{ .CommitTimestamp }}"

archives:
  - formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}"
    files:
      - README.md
      - LICENSE
      - THIRD-PARTY-NOTICES
      - install.sh

checksum:
  name_template: checksums.txt

signs:
  - id: cosign
    artifacts: checksum
    cmd: cosign
    signature: ${artifact}.cosign
    args:
      - sign-blob
      - --oidc-provider=github-actions
      - --bundle=${signature}
      - ${artifact}
      - --yes

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
